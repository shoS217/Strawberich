<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Strawberich-Home</title>
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <!--ロゴ-->
        <div class="logo-wrapper">
            <img class="logo" src="images/logo.png" alt="ロゴ">
        </div>
        <!--About-->
        <div id="about-wrapper">
            <div id="about-text">
                <h1>いちごの良さを活かしたスイーツ</h1>
                <p>一年中いちごスイーツを楽しめるよう、全国から厳選した新鮮ないちごをふんだんに使ってちょっと贅沢なスイーツを作っています。
                    季節ごとに異なる品種のいちごを取り入れており、それぞれのいちごの特徴を引き出し心地よい余韻を楽しめるようなスイーツやドリンクを提供しております。
                </p>
            </div>
        </div>
        <!--Menu-->
        <div id="menu-wrapper">
            <h1>Menu</h1>
            <p>季節ごとの新鮮ないちごを使用した多彩なスイーツやドリンクメニューをご紹介しています。
                ケーキやタルトなど、見た目にも華やかなスイーツが揃い、その時々のいちごの美味しさを存分に味わっていただけます
            </p>
            <img id="products-img" src="images/product-catalog.JPG" alt="商品集">
            <button id="menu-btn">view more</button>
        </div>
    </body>
</html>
